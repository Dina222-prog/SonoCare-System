<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SonoCare - Appointments</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    >
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            SonoCare
        </div>

        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="patients.html">Patients</a>
            <a href="appointments.html">Appointments</a>
            <a href="reports.html">Reports</a>
        </div>

    </nav>


    <header>
        <h1>Appointment Management</h1>
        <p>Schedule and manage ultrasound appointments.</p>
    </header>


    <main>

        <div id="appointmentMessage" class="message-box"></div>

        <section class="appointment-form">

            <h2>Add New Appointment</h2>

            <form id="appointmentForm">

                <div class="patient-lookup">

                    <input
                        type="text"
                        id="patientIdSearch"
                        placeholder="Enter Patient ID"
                    >

                    <button
                        type="button"
                        id="findPatientBtn">
                        Find Patient
                    </button>

                </div>

                <input
                    type="text"
                    id="selectedPatientName"
                    placeholder="Patient Name"
                    readonly
                >

                <select id="patientSelect">
                    <option value="">Select Patient</option>
                </select>

                <select id="examType" required>
                    <option value="">Select Examination</option>
                    <option value="Abdomen">Abdomen</option>
                    <option value="Pelvis">Pelvis</option>
                    <option value="Thyroid">Thyroid</option>
                    <option value="Breast">Breast</option>
                    <option value="Obstetrics">Obstetrics</option>
                    <option value="Vascular">Vascular</option>
                    <option value="Echocardiography">Echocardiography</option>
                </select>

                <input
                    type="text"
                    id="appointmentDate"
                    placeholder="Select Date"
                    required
                >

                <input
                    type="text"
                    id="appointmentTime"
                    placeholder="Select Time"
                    required
                >

                <select id="appointmentStatus" required>
                    <option value="">Select Status</option>
                    <option value="Scheduled">Scheduled</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>

                <button
                    type="submit"
                    id="appointmentSubmitButton">
                    Save Appointment
                </button>

            </form>

        </section>


        <section class="appointments-list">

            <h2>Appointments</h2>

            <div class="search-box">

                <input
                    type="text"
                    id="appointmentSearch"
                    placeholder="Search by Patient Name or ID"
                >

            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Patient Name</th>
                            <th>Patient ID</th>
                            <th>Examination</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="appointmentsTableBody">
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <div class="logout-container">

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>

    </div>


    <footer>
        <p>
            © 2026 SonoCare - Ultrasound Information Management System
        </p>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="auth.js"></script>
    <script src="appointments.js"></script>

</body>

</html>
